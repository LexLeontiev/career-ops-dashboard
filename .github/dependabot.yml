version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-production:
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
