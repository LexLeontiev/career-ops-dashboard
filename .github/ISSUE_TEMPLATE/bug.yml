name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real career data, resumes, reports, credentials, `.env` files, or other secrets.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction steps
      description: Give minimal steps using fixture or invented data only.
      placeholder: |
        1. Start the app with the fixture.
        2. Open the dashboard.
        3. Observe the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, or WSL
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: v22.13.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 140
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: npm run check result
      description: Paste the result without private paths, career data, or secrets.
    validations:
      required: true
